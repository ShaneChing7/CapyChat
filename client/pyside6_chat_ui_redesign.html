
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); }
body { background: transparent; }
.app { display: flex; width: 100%; height: 560px; border-radius: var(--border-radius-lg); overflow: hidden; border: 0.5px solid var(--color-border-secondary); background: #faf8f5; }

.sidebar { width: 220px; flex-shrink: 0; background: #f2ede7; display: flex; flex-direction: column; border-right: 0.5px solid #e0d9d0; }
.sidebar-header { padding: 16px 14px 12px; border-bottom: 0.5px solid #e0d9d0; }
.user-info { display: flex; align-items: center; gap: 10px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: #c8785a; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; font-weight: 500; flex-shrink: 0; }
.user-name { font-size: 14px; font-weight: 500; color: #3a3028; }
.user-ip { font-size: 11px; color: #8a7d72; margin-top: 1px; }

.section-label { padding: 12px 14px 6px; font-size: 11px; color: #9a8f84; letter-spacing: 0.05em; text-transform: uppercase; }
.room-list { flex: 1; padding: 4px 8px; overflow-y: auto; }
.room-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 2px; }
.room-item.active { background: #d4856a; }
.room-item.active .room-icon { color: #fff; }
.room-item.active .room-name { color: #fff; }
.room-icon { font-size: 16px; color: #8a7d72; }
.room-name { font-size: 13px; color: #5a4e46; font-weight: 400; }
.room-badge { margin-left: auto; background: #c8785a; color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 10px; }

.online-dot { width: 6px; height: 6px; background: #6ab87a; border-radius: 50%; margin-left: auto; }

.sidebar-footer { padding: 10px 8px; border-top: 0.5px solid #e0d9d0; }
.exit-btn { width: 100%; padding: 8px; border-radius: 8px; border: 0.5px solid #d4c8be; background: transparent; color: #8a7d72; font-size: 13px; cursor: pointer; }
.exit-btn:hover { background: #e8e2db; }

.chat-area { flex: 1; display: flex; flex-direction: column; background: #faf8f5; }
.chat-header { padding: 14px 20px; border-bottom: 0.5px solid #e8e2db; display: flex; align-items: center; gap: 10px; }
.chat-title { font-size: 15px; font-weight: 500; color: #3a3028; }
.online-count { font-size: 12px; color: #9a8f84; margin-left: auto; }
.green-dot { display: inline-block; width: 7px; height: 7px; background: #6ab87a; border-radius: 50%; margin-right: 5px; }

.messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }

.msg-row { display: flex; align-items: flex-end; gap: 8px; }
.msg-row.mine { flex-direction: row-reverse; }
.msg-avatar { width: 30px; height: 30px; border-radius: 50%; background: #c8785a; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 500; flex-shrink: 0; }
.msg-avatar.other { background: #a0bcda; }

.msg-bubble-wrap { display: flex; flex-direction: column; max-width: 60%; }
.msg-row.mine .msg-bubble-wrap { align-items: flex-end; }
.msg-sender { font-size: 11px; color: #9a8f84; margin-bottom: 3px; padding: 0 4px; }
.msg-bubble { padding: 8px 13px; border-radius: 16px; font-size: 13px; line-height: 1.5; }
.msg-row.mine .msg-bubble { background: #d4856a; color: #fff; border-bottom-right-radius: 4px; }
.msg-row.other .msg-bubble { background: #ede8e2; color: #3a3028; border-bottom-left-radius: 4px; }
.msg-time { font-size: 10px; color: #b0a49a; margin-top: 3px; padding: 0 4px; }

.system-msg { text-align: center; font-size: 11px; color: #b0a49a; padding: 4px 0; }

.toolbar { padding: 8px 16px 6px; border-top: 0.5px solid #e8e2db; display: flex; gap: 4px; }
.tool-btn { width: 32px; height: 32px; border-radius: 8px; border: none; background: transparent; color: #8a7d72; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 17px; }
.tool-btn:hover { background: #ede8e2; color: #5a4e46; }

.input-row { padding: 0 16px 14px; display: flex; gap: 10px; align-items: flex-end; }
.input-wrap { flex: 1; background: #ede8e2; border-radius: 12px; border: 0.5px solid #d8d0c8; padding: 8px 12px; min-height: 38px; display: flex; align-items: center; }
.input-fake { font-size: 13px; color: #b0a49a; }
.send-btn { padding: 8px 18px; background: #c8785a; color: #fff; border: none; border-radius: 10px; font-size: 13px; font-weight: 500; cursor: pointer; flex-shrink: 0; white-space: nowrap; }
.send-btn:hover { background: #b86a4d; }
</style>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="user-info">
        <div class="avatar">A</div>
        <div>
          <div class="user-name">用户 A</div>
          <div class="user-ip">127.0.0.1:9002</div>
        </div>
      </div>
    </div>

    <div class="section-label">频道</div>
    <div class="room-list">
      <div class="room-item active">
        <i class="ti ti-home-2 room-icon" aria-hidden="true"></i>
        <span class="room-name">广场</span>
        <span class="online-dot"></span>
      </div>
      <div class="room-item">
        <i class="ti ti-message room-icon" aria-hidden="true"></i>
        <span class="room-name">技术交流</span>
      </div>
      <div class="room-item">
        <i class="ti ti-lock room-icon" aria-hidden="true"></i>
        <span class="room-name">私聊</span>
        <span class="room-badge">3</span>
      </div>
    </div>

    <div class="sidebar-footer">
      <button class="exit-btn">退出聊天室</button>

  </div>

  <div class="chat-area">

      <div class="msg-row mine">

          <div class="msg-bubble">你好，今天吃了什么？</div>
          <div class="msg-time">13:12</div>

      </div>
      <div class="msg-row other">
        <div class="msg-avatar other">B</div>
        <div class="msg-bubble-wrap">
          <div class="msg-sender">用户 B</div>

          <div class="msg-time">13:13</div>

    </div>

    <div class="toolbar">
      <button class="tool-btn" title="图片"><i class="ti ti-photo" aria-hidden="true"></i></button>
      <button class="tool-btn" title="视频"><i class="ti ti-video" aria-hidden="true"></i></button>
      <button class="tool-btn" title="音频"><i class="ti ti-music" aria-hidden="true"></i></button>
      <button class="tool-btn" title="文件"><i class="ti ti-upload" aria-hidden="true"></i></button>
      <button class="tool-btn" title="表情"><i class="ti ti-mood-smile" aria-hidden="true"></i></button>
    </div>

    <div class="input-row">
      <div class="input-wrap">
        <span class="input-fake">请输入消息...</span>
      </div>
      <button class="send-btn">发送</button>
    </div>
  </div>
</div>
